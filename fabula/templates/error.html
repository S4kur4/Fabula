{% extends "base.html" %}
{% block title %}{{ code }} | {{ brand_title }}{% endblock %}
{% block body_class %}error-page{% endblock %}
{% block body %}
  <main class="error-layout" id="main-content">
    <a class="wordmark" href="{{ url_for('public.index') }}">{{ brand_title }}</a>
    <div>
      <p class="error-code">{{ code }}</p>
      <h1>{{ message }}</h1>
      <a class="text-link" href="{{ url_for('public.index') }}">{{ t("返回公开作品站") }}</a>
    </div>
  </main>
{% endblock %}
